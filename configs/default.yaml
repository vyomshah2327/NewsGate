# Real-data configuration (FNSPID news + prices).
# Before running: download FNSPID into data/raw/fnspid/ (see README), then audit timestamps in
# notebooks/01_data_audit.ipynb and choose the tickers and date range.
data:
  source: fnspid            # fnspid | yfinance | synthetic
  news_path: data/raw/fnspid/news.parquet
  price_dir: data/raw/fnspid/prices
  metadata_path: data/raw/metadata.csv   # ticker, sector, market_cap (for stratified sampling)
  n_tickers: 40
  start: "2012-01-01"
  end: "2023-12-31"
  source_timezone: UTC      # TO VERIFY against the FNSPID Date column
  timestamp_mode: auto      # auto | datetime | date_only
  market_symbol: SPY        # falls back to an equal-weight sample mean if absent
sentiment:
  scorers: [vader, lm, finbert]
  lm_dictionary_path: data/external/Loughran-McDonald_MasterDictionary.csv
target:
  horizon: 1
  quantile: 0.9
  threshold_scope: ticker
evaluation:
  min_train_days: 756
  test_block_days: 126
  purge_days: 5
  holdout_fraction: 0.2
  kinds: [logistic, lightgbm]
gate:
  enabled: true
  kind: lightgbm
run:
  name: fnspid_main
